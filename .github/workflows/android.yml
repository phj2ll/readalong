name: Android APK

# 触发方式：
#   1. push 到 main（只要动了前端/手机端代码）→ 自动构建 APK，作为 workflow artifact 可下载
#   2. push v* tag → 额外把 APK 挂到 GitHub Release
#   3. 手动触发（Actions 页面 Run workflow）
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'frontend/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'mobile/**'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag 时上传 Release 资产需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 不再用 android-actions/setup-android：它是 Node20 动作，GitHub 已不支持。
      # ubuntu 镜像自带 Android SDK（ANDROID_HOME 已配好），缺的组件自己补。
      - name: Ensure Android SDK 35
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -d "$SDK/platforms/android-35" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi
          ls "$SDK/platforms"

      - uses: gradle/actions/setup-gradle@v4

      # 手机端前端产物：Reader 模式（纯前端 + JS 直连讯飞评分）
      - name: Build web assets
        run: |
          cd frontend
          npm ci
          npm run build:mobile

      # 同步 web 产物进 Android 工程
      - name: Capacitor sync
        run: |
          cd mobile
          npm ci
          npx cap sync android

      # 出包：优先用正式证书签名的 release 包。
      # debug 包用的是 Android 调试证书，vivo 等 ROM 会以
      # 「安装包缺乏开发者证书」拒绝安装，所以必须走 release 签名。
      # 密钥库放在仓库 Secret（ANDROID_KEYSTORE_B64）里，不入库。
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PW: ReadAlong2026Sign
        run: |
          cd mobile/android
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "使用正式证书签名（release）"
            mkdir -p "$RUNNER_TEMP"
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/readalong.jks"
            ./gradlew assembleRelease --no-daemon \
              -PversionCode=${{ github.run_number }} \
              -PversionName="0.1.${{ github.run_number }}" \
              -PstoreFile="$RUNNER_TEMP/readalong.jks" \
              -PstorePassword="$KEYSTORE_PW" \
              -PkeyAlias=readalong \
              -PkeyPassword="$KEYSTORE_PW"
            echo "APK_PATH=mobile/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_B64，构建的是 debug 包（vivo 等 ROM 会拒装）"
            ./gradlew assembleDebug --no-daemon \
              -PversionCode=${{ github.run_number }} \
              -PversionName="0.1.${{ github.run_number }}"
            echo "APK_PATH=mobile/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Rename APK
        run: |
          mkdir -p out
          cp "$APK_PATH" "out/ReadAlong-${{ github.sha }}.apk"
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: readalong-apk
          path: out/*.apk
          retention-days: 30

      # push main：滚动更新一个 tag=latest 的预发布 Release，
      # 手机上打开 Releases 页或固定链接就能直接下载安装
      - name: Publish rolling release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建（自动）
          body: |
            提交：${{ github.sha }}
            构建号：${{ github.run_number }}
            内容：Android debug APK，覆盖安装即可升级。
          files: out/*.apk
          prerelease: true
          make_latest: false

      # 打 v* 标签：发布正式 Release（带自动 release notes）
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: out/*.apk
          generate_release_notes: true
