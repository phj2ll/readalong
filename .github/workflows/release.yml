name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ReadAlong Studio：桌面版（课程生成 + 练习），产物 exe
  studio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Set version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wails.json'));c.info={...c.info,productVersion:'$v'};fs.writeFileSync('wails.json',JSON.stringify(c,null,2));"

      - name: Wails build
        run: wails build -clean -platform windows/amd64 -ldflags "-X main.version=${GITHUB_REF_NAME#v}"

      # 同一个 tag 下 Android APK 工作流可能已经先建好 Release，
      # 这里先判断再建，然后统一用 upload 追加资产（--clobber 覆盖同名文件）。
      # 两个 job 可能同时 create，后到的那次会报 already exists，用 || true 吞掉。
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" build/bin/readalong.exe --clobber

  # ReadAlong Reader：纯前端阅读端，产物 zip（本地打开 / 静态托管均可）
  reader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Pack reader
        run: |
          cd frontend/dist
          zip -r "../../readalong-reader.zip" reader.html assets

      # Release 是 studio job（或 android.yml）建的，而本 job 通常先跑完，
      # 所以不能直接 upload —— 找不到 Release 会直接失败（v0.1.5~v0.1.8 一直是这个原因）。
      # 和 studio job 一样：先确保 Release 存在，再上传。
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" readalong-reader.zip --clobber
