name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ReadAlong Studio：桌面版（课程生成 + 练习），产物 exe
  studio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Set version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wails.json'));c.info={...c.info,productVersion:'$v'};fs.writeFileSync('wails.json',JSON.stringify(c,null,2));"

      - name: Wails build
        run: wails build -clean -platform windows/amd64 -ldflags "-X main.version=${GITHUB_REF_NAME#v}"

      # 同一个 tag 下 Android APK 工作流可能已经先建好 Release，
      # 这里先判断再建，然后统一用 upload 追加资产（--clobber 覆盖同名文件）。
      # 两个 job 可能同时 create，后到的那次会报 already exists，用 || true 吞掉。
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" build/bin/readalong.exe --clobber

  # 注：曾经有一个 reader job，把 frontend/dist 打成 readalong-reader.zip 挂到 Release。
  # Reader 前端已经随 APK（android.yml，Capacitor 壳）一起发布，桌面用户也不需要它，
  # 所以不再上传。真要临时拿到它，本地 `cd frontend && npm run build` 后自己打 zip 即可。
